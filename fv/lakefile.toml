name = "zlib-fv"
# Formal-verification development for zlib, targeting the Lean 4 Clight
# semantics + separation logic in Certora/CompCert, subdirectory export/ (CCLib).
#
#   InftreesAST             : generated by `clightgen -lean -normalize` from
#                             ../inftrees.c (byte-identical to the export repo's
#                             GenZInftrees.lean; regenerate with
#                             `clightgen -lean -normalize -o fv/InftreesAST.lean inftrees.c`)
#   InflateTableSpec        : footprint predicates, the minimal assumption set
#                             (A1-A5 of fv/memory-safety.md), and the FunSpec
#   InflateTableInvariants  : the pure (semantics-free) counting model of
#                             inflate_table and the arithmetic lemmas the loop
#                             invariant needs — provable independently
#   InflateTableSafety      : the main theorem statement (SatisfiesAt), one
#                             corollary per code type
defaultTargets = ["InftreesAST", "InflateTableSpec", "InflateTableInvariants",
                  "InflateTableLayout", "InflateTableBody",
                  "InflateTableEntry", "InflateTableChain",
                  "InflateTableSafety"]

# CCLib: the Lean side of `clightgen -lean`, developed in the `export/`
# subdirectory of Certora/CompCert (branch feat/c-to-lean). Pinned to a commit;
# bump with `lake update compcert-clight-lean` after changing `rev`.
# To develop against a local checkout instead, temporarily replace the three
# git lines below with `path = "/path/to/CompCert/export"` (do not commit that).
[[require]]
name = "compcert-clight-lean"
git = "https://github.com/Certora/CompCert.git"
rev = "123f7f7767e215aceb4821f0d044336d78103ade"
subDir = "export"

[[lean_lib]]
name = "InftreesAST"

[[lean_lib]]
name = "InflateTableSpec"

[[lean_lib]]
name = "InflateTableInvariants"

[[lean_lib]]
name = "InflateTableSafety"

[[lean_lib]]
name = "InflateTableLayout"
[[lean_lib]]
name = "InflateTableBody"

[[lean_lib]]
name = "InflateTableEntry"

[[lean_lib]]
name = "InflateTableChain"
